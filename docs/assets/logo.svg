<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <!-- Sigma & Wave Gradient -->
    <linearGradient id="primaryGrad" x1="140" y1="120" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  <!-- Squircle Canvas Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />
  <!-- Subtitle Grid/Mesh Lines -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6, 6">
    <line x1="96" y1="160" x2="416" y2="160" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="352" x2="416" y2="352" />
    <line x1="176" y1="96" x2="176" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="336" y1="96" x2="336" y2="416" />
  </g>
  <!-- Core Sigma (Σ) Geometry Interlocked with Upward Trend -->
  <path d="M 370,140 H 160 L 260,256 160,372 h 210" fill="none" stroke="url(#primaryGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
</svg>
